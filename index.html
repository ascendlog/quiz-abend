<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quiz-Abend">
<link rel="apple-touch-icon" href="icon.png">
<title>Quiz-Abend</title>
<style>
  :root {
    --ink: #1A1916;
    --ink-soft: #5F5E5A;
    --ink-faint: #888780;
    --paper: #F7F5F0;
    --paper-warm: #EFECEA;
    --border: #D4D3CE;
    --border-soft: #E8E6DF;
    --white: #FFFFFF;
    --accent: #854F0B;
    --accent-soft: #FAEEDA;
    --green: #3B6D11;
    --green-soft: #EAF3DE;
    --red: #A32D2D;
    --red-soft: #FCEBEB;
    --radius: 10px;
    --radius-sm: 7px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button { font-family: inherit; touch-action: manipulation; -webkit-appearance: none; appearance: none; }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  .logo { font-size: 13px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; }
  .sub { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 20px; }
  h1 { font-size: 26px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.25; margin-bottom: 8px; }
  h1 strong { font-weight: 600; }
  .lead { font-size: 15px; color: var(--ink-soft); line-height: 1.65; margin-bottom: 18px; }

  .card {
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 10px;
  }
  .btn {
    display: block; width: 100%;
    min-height: 52px;
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--white);
    color: var(--ink);
    font-size: 16px; font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .btn:active { opacity: 0.7; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .btn.ghost { background: transparent; color: var(--ink-soft); font-weight: 500; }
  .btn.small { min-height: 44px; font-size: 14px; padding: 10px 14px; }
  .btn[disabled] { opacity: 0.35; }
  .btnrow { display: flex; gap: 10px; }
  .btnrow .btn { flex: 1; }
  .linkbtn { background: none; border: none; color: var(--ink-faint); font-size: 12px; text-decoration: underline; padding: 8px 4px; cursor: pointer; }
  .center { text-align: center; }

  .notice { background: var(--accent-soft); color: #633806; border-radius: var(--radius-sm); padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
  .errtext { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 6px; }

  input[type="text"] {
    width: 100%;
    background: var(--white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-family: inherit; font-size: 16px;
    color: var(--ink);
    outline: none;
    margin-bottom: 10px;
    -webkit-appearance: none; appearance: none;
  }
  input[type="text"]:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(26,25,22,0.07); }
  input.big { font-size: 24px; text-align: center; padding: 14px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 15px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--white);
    font-size: 14px; font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .chip.sel { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip:active { opacity: 0.7; }
  .seg { display: flex; border: 1.5px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--white); }
  .seg button { flex: 1; padding: 12px 8px; border: none; background: transparent; font-size: 14px; font-weight: 500; color: var(--ink-soft); cursor: pointer; }
  .seg button.sel { background: var(--ink); color: var(--paper); }
  .stepper { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .stepper button { width: 52px; height: 52px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--white); font-size: 24px; color: var(--ink); cursor: pointer; }
  .stepper button:active { opacity: 0.7; }
  .stepper .val { flex: 1; text-align: center; font-size: 24px; font-weight: 300; }
  .stepper .unit { display: block; font-size: 11px; color: var(--ink-faint); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 400; }
  .hint { font-size: 13px; color: var(--ink-soft); margin-top: 10px; }
  .hint.warn { color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 7px 0; border-bottom: 1px solid var(--border-soft); text-align: left; }
  th { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .scorebar { display: flex; gap: 10px; margin-bottom: 8px; }
  .pbox { flex: 1; background: var(--white); border: 1.5px solid var(--border-soft); border-radius: var(--radius); padding: 9px 12px; text-align: center; min-width: 0; }
  .pbox.active { border-color: var(--ink); }
  .pname { font-size: 12px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pscore { font-size: 28px; font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .progress { font-size: 12px; color: var(--ink-faint); text-align: center; margin-bottom: 14px; letter-spacing: 0.04em; }

  .meta { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; }
  .qtext { font-size: 20px; line-height: 1.4; margin-bottom: 16px; }
  .answers { display: flex; flex-direction: column; gap: 10px; }
  .ans {
    display: flex; align-items: center; gap: 12px;
    text-align: left;
    min-height: 58px; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    background: var(--white); color: var(--ink);
    font-size: 16px; cursor: pointer;
  }
  .ans:active { background: var(--paper-warm); }
  .ans .letter { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--paper-warm); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .ans.ok { background: var(--green-soft); border-color: var(--green); color: var(--green); }
  .ans.bad { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .ans.dim { opacity: 0.45; }
  .ans.gone { visibility: hidden; }
  .ans[disabled] { cursor: default; }
  .ans.tf { justify-content: center; font-weight: 600; }

  .timer { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .tbar-wrap { flex: 1; height: 6px; background: var(--border-soft); border-radius: 3px; overflow: hidden; }
  .tbar { height: 100%; width: 100%; background: var(--ink); }
  .tbar.low { background: var(--red); }
  .tlab { min-width: 24px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  .jokers { display: flex; gap: 10px; margin-top: 14px; }
  .jokers .btn { margin-bottom: 0; }

  .banner { padding: 12px 14px; border-radius: var(--radius-sm); margin: 14px 0; font-weight: 600; }
  .banner small { display: block; font-weight: 400; opacity: 0.85; margin-top: 2px; }
  .banner.good { background: var(--green-soft); color: var(--green); }
  .banner.miss { background: var(--red-soft); color: var(--red); }
  .info { font-size: 14px; color: var(--ink-soft); margin-bottom: 14px; }
  .big { font-size: 22px; font-weight: 300; line-height: 1.3; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 15px; }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--ink-soft); }
  .row .v { font-weight: 600; text-align: right; }
  .ans .atext { flex: 1; }
  .ans .who { flex: 0 0 auto; max-width: 42%; text-align: right; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.8; }
  .ans.picked { border-color: var(--ink); background: var(--paper-warm); }
  .codebig { font-size: 56px; font-weight: 300; letter-spacing: 0.18em; text-align: center; padding-left: 0.18em; line-height: 1.2; font-variant-numeric: tabular-nums; margin: 4px 0 10px; }
  textarea {
    width: 100%; background: var(--white); border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 14px; font-family: inherit; font-size: 16px; line-height: 1.4; color: var(--ink);
    outline: none; margin-bottom: 10px; resize: none; -webkit-appearance: none; appearance: none;
  }
  textarea:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(26,25,22,0.07); }
  .banner.neutral { background: var(--accent-soft); color: #633806; }
  .qa { padding: 10px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
  .qa:last-child { border-bottom: none; }
  .qa .qf { color: var(--ink-faint); font-size: 12px; margin-bottom: 3px; }
  .qa.skip { opacity: 0.55; }
  .own { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
  .own:last-child { border-bottom: none; }
  .own .t { flex: 1; }
  .own .m { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); margin-top: 2px; }
  .own button { background: none; border: none; color: var(--red); font-size: 13px; padding: 6px 4px; cursor: pointer; }
  .trophy { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="lead">Lade Fragen …</p></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(function () {
  'use strict';

  // ── Konstanten ─────────────────────────────────────────────────────────────
  var STORE_KEY = 'quiz_abend_v1';
  var BASE_KEY = 'quiz_abend_base_v1';
  var TIME = { mc: 30, tf: 30, est: 30 };
  var POINTS = 10, BONUS_MAX = 5, EXACT_BONUS = 5;
  var LEVELS = { 0: 'Gemischt', 1: 'Leicht', 2: 'Mittel', 3: 'Schwer' };
  var TYPE_LABELS = { mc: 'Multiple Choice', tf: 'Wahr oder falsch', est: 'Schätzfragen' };
  var DEFAULTS = { cats: null, level: 0, types: { mc: true, tf: true, est: true }, mode: 'count', n: 10, target: 100 };
  var PDEFAULTS = { pmode: 'kennt', level: 1, n: 10, wertung: 'gegen', vorschlag: true, eigen: true };
  var PBASE_KEY = 'quiz_abend_pbase_v1';

  // ── Hilfsfunktionen ────────────────────────────────────────────────────────
  var app = document.getElementById('app');

  function el(tag, props) {
    var e = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) append(e, arguments[i]);
    return e;
  }
  function append(parent, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { append(parent, k); }); return; }
    parent.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // ── Speicher ───────────────────────────────────────────────────────────────
  function loadStore() {
    var s = {};
    try { s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) { s = {}; }
    var st = s.settings || {};
    return {
      names: Array.isArray(s.names) ? s.names : ['', ''],
      bilanz: s.bilanz && typeof s.bilanz === 'object' ? s.bilanz : {},
      imported: Array.isArray(s.imported) ? s.imported : [],
      catLabels: s.catLabels && typeof s.catLabels === 'object' ? s.catLabels : {},
      seen: Array.isArray(s.seen) ? s.seen : [],
      recGids: Array.isArray(s.recGids) ? s.recGids : [],
      pq: Array.isArray(s.pq) ? s.pq : [],
      pseen: Array.isArray(s.pseen) ? s.pseen : [],
      psettings: Object.assign({}, PDEFAULTS, s.psettings || {}),
      myName: typeof s.myName === 'string' ? s.myName : '',
      lastCode: typeof s.lastCode === 'string' ? s.lastCode : '',
      live: s.live && s.live.L ? s.live : null,
      settings: Object.assign({}, DEFAULTS, st, { types: Object.assign({}, DEFAULTS.types, st.types || {}) }),
      game: s.game || null
    };
  }
  var S = loadStore();
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
  function persistGame() {
    if (!G) return;
    var copy = Object.assign({}, G); delete copy.pool;
    S.game = copy; save();
  }

  // ── Fragen ─────────────────────────────────────────────────────────────────
  var base = { kategorien: {}, fragen: [], paar: [] };
  var loadError = null;

  function cleanQ(q) {
    if (!q || typeof q !== 'object') return null;
    var id = String(q.id || '').trim(), kat = String(q.kat || '').trim(), frage = String(q.frage || '').trim();
    var stufe = Number(q.stufe), typ = q.typ;
    if (!id || !kat || !frage || [1, 2, 3].indexOf(stufe) < 0) return null;
    var out = { id: id, kat: kat, stufe: stufe, typ: typ, frage: frage };
    if (q.thema) out.thema = String(q.thema);
    if (q.info) out.info = String(q.info);
    if (typ === 'mc') {
      if (!Array.isArray(q.antworten) || q.antworten.length !== 4) return null;
      var r = Number(q.richtig);
      if (!Number.isInteger(r) || r < 0 || r > 3) return null;
      out.antworten = q.antworten.map(String); out.richtig = r;
    } else if (typ === 'tf') {
      if (typeof q.richtig !== 'boolean') return null;
      out.richtig = q.richtig;
    } else if (typ === 'est') {
      var n = Number(q.richtig);
      if (q.richtig === null || q.richtig === '' || !isFinite(n)) return null;
      out.richtig = n; out.einheit = String(q.einheit || ''); out.toleranz = Number(q.toleranz) || 0;
    } else return null;
    return out;
  }

  function loadPaar() {
    return fetch('paarfragen.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (d) {
      if (!d || !Array.isArray(d.fragen)) throw new Error('Format');
      base.paar = d.fragen.map(cleanPQ).filter(Boolean);
      try { localStorage.setItem(PBASE_KEY, JSON.stringify(base.paar)); } catch (e) {}
    }).catch(function () {
      try { var c = JSON.parse(localStorage.getItem(PBASE_KEY) || 'null'); if (Array.isArray(c)) base.paar = c; } catch (x) {}
    });
  }

  function loadBase() {
    return loadWissen().then(loadPaar);
  }

  function loadWissen() {
    return fetch('fragen.json', { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (d) {
      if (!d || !Array.isArray(d.fragen)) throw new Error('Format');
      base = { kategorien: d.kategorien || {}, fragen: d.fragen.map(cleanQ).filter(Boolean), paar: base.paar || [] };
      try { localStorage.setItem(BASE_KEY, JSON.stringify(base)); } catch (e) {}
    }).catch(function (e) {
      try {
        var c = JSON.parse(localStorage.getItem(BASE_KEY) || 'null');
        if (c && Array.isArray(c.fragen) && c.fragen.length) { base = { kategorien: c.kategorien || {}, fragen: c.fragen, paar: base.paar || [] }; return; }
      } catch (x) {}
      loadError = e && e.message ? e.message : 'Fehler';
    });
  }

  function allQuestions() { return base.fragen.concat(S.imported); }
  function catLabel(k) { return base.kategorien[k] || S.catLabels[k] || k; }
  function allCatKeys() {
    var seen = {}, keys = [];
    allQuestions().forEach(function (q) { if (!seen[q.kat]) { seen[q.kat] = 1; keys.push(q.kat); } });
    return keys;
  }
  function selectedCats() { var all = allCatKeys(); return S.settings.cats === null ? all : S.settings.cats.filter(function (k) { return all.indexOf(k) >= 0; }); }

  function poolFor(st) {
    var cats = st.cats === null ? null : st.cats;
    return allQuestions().filter(function (q) {
      return (!cats || cats.indexOf(q.kat) >= 0) && (st.level === 0 || q.stufe === st.level) && st.types[q.typ];
    });
  }

  function makePool(st) {
    var seen = {}; S.seen.forEach(function (id) { seen[id] = 1; });
    var p = poolFor(st);
    function group(typ) {
      var a = p.filter(function (q) { return q.typ === typ; });
      var un = shuffle(a.filter(function (q) { return !seen[q.id]; }));
      var se = shuffle(a.filter(function (q) { return seen[q.id]; }));
      return un.concat(se);
    }
    return { mc: group('mc'), tf: group('tf'), est: group('est') };
  }

  function markSeen(q) {
    if (S.seen.indexOf(q.id) < 0) S.seen.push(q.id);
    if (S.seen.length > 1000) S.seen = S.seen.slice(-800);
  }

  function takeStd(g) {
    g = g || G;
    var kinds = [];
    if (g.pool.mc.length) kinds.push('mc');
    if (g.pool.tf.length) kinds.push('tf');
    if (!kinds.length) {
      g.pool = makePool(g.settings);
      if (g.pool.mc.length) kinds.push('mc');
      if (g.pool.tf.length) kinds.push('tf');
      if (!kinds.length) return null;
    }
    var kind = kinds.length === 2 ? (Math.random() < 0.25 ? 'tf' : 'mc') : kinds[0];
    var q = g.pool[kind].shift(); markSeen(q); return q;
  }
  function takeEst(g) {
    g = g || G;
    if (!g.pool.est.length) { g.pool = makePool(g.settings); if (!g.pool.est.length) return null; }
    var q = g.pool.est.shift(); markSeen(q); return q;
  }

  // ── Spiel ──────────────────────────────────────────────────────────────────
  var G = null;          // laufendes Spiel
  var view = 'home';     // home | setup | play | result
  var ui = {};           // Zustand der Spielansicht
  var timerId = null;
  var notice = '';

  function newGame(st, names) {
    G = {
      settings: clone(st), names: names.slice(),
      scores: [0, 0], right: [0, 0], stdAsked: [0, 0], estWins: [0, 0],
      jokers: [{ fifty: 1, swap: 1 }, { fifty: 1, swap: 1 }],
      queue: [], idx: 0, over: false, recorded: false, rounds: 0,
      allowEst: false, allowStd: false
    };
    var pool = poolFor(G.settings);
    G.allowEst = pool.some(function (q) { return q.typ === 'est'; });
    G.allowStd = pool.some(function (q) { return q.typ !== 'est'; });
    G.pool = makePool(G.settings);
    if (G.settings.mode === 'count') buildCountQueue(); else extendTarget();
    persistGame();
  }

  function buildCountQueue() {
    var n = G.settings.n, estCount = G.pool.est.length, e = 0;
    if (G.allowEst && !G.allowStd) e = Math.min(n, estCount);
    else if (G.allowEst) {
      e = Math.min(Math.round(n * 0.2), estCount);
      if ((n - e) % 2) e = (e + 1 <= estCount && e + 1 <= n) ? e + 1 : Math.max(0, e - 1);
    }
    var m = G.allowStd ? n - e : 0;
    var tokens = [];
    for (var i = 0; i < e; i++) tokens.push('E');
    for (var j = 0; j < m; j++) tokens.push('S');
    tokens = shuffle(tokens);
    var who = 0;
    tokens.forEach(function (t) {
      if (t === 'E') {
        var qe = takeEst(); if (qe) G.queue.push({ q: qe, who: 'both', guesses: [null, null], endsRound: true });
      } else {
        var qs = takeStd(); if (qs) { G.queue.push({ q: qs, who: who }); who = 1 - who; }
      }
    });
  }

  function extendTarget() {
    G.rounds++;
    if (G.allowEst && (!G.allowStd || Math.random() < 0.2)) {
      var qe = takeEst();
      if (qe) { G.queue.push({ q: qe, who: 'both', guesses: [null, null], endsRound: true }); return; }
    }
    var q1 = takeStd(), q2 = takeStd();
    if (q1) G.queue.push({ q: q1, who: 0 });

      el('button', { class: 'btn primary', text: 'Revanche', onclick: function () { var st = G.settings, nm = G.names; startGame(st, nm); } }),

  // ── Import und Sicherung ───────────────────────────────────────────────────
  document.getElementById('fileIn').addEventListener('change', function () {
    var f = this.files && this.files[0]; this.value = '';
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        var list = Array.isArray(d) ? d : (d && Array.isArray(d.fragen) ? d.fragen : null);
        var plist = d && Array.isArray(d.paarfragen) ? d.paarfragen : [];
        if (list) {
          var wl = [];
          list.forEach(function (x) { if (x && (x.typ === 'frei' || x.typ === 'wahl')) plist.push(x); else wl.push(x); });
          list = wl;
        }
        if (!list && !plist.length && !(d && d.bilanz)) throw new Error('Format');
        var ids = {}; allQuestions().forEach(function (q) { ids[q.id] = 1; });
        var added = 0, skipped = 0, dup = 0;
        (list || []).forEach(function (raw) {
          var q = cleanQ(raw);
          if (!q) { skipped++; return; }
          if (ids[q.id]) { dup++; return; }
          ids[q.id] = 1; S.imported.push(q); added++;
        });
        if (d && d.kategorien && typeof d.kategorien === 'object') {
          Object.keys(d.kategorien).forEach(function (k) { if (!base.kategorien[k]) S.catLabels[k] = String(d.kategorien[k]); });
        }
        var pAdded = 0;
        var pids = {}; (base.paar || []).concat(S.pq).forEach(function (q) { pids[q.id] = 1; });
        plist.forEach(function (raw) {
          var q = cleanPQ(raw);
          if (!q) { skipped++; return; }
          if (pids[q.id]) { dup++; return; }
          pids[q.id] = 1; S.pq.push(q); pAdded++;
        });
        var bil = 0;
        if (d && d.bilanz && typeof d.bilanz === 'object') {
          Object.keys(d.bilanz).forEach(function (k) {
            var r = d.bilanz[k];
            if (r && typeof r.games === 'number' && typeof r.wins === 'number' && (!S.bilanz[k] || r.games > S.bilanz[k].games)) { S.bilanz[k] = { name: String(r.name || k), wins: r.wins, games: r.games }; bil++; }
          });
        }
        save();
        var parts = [added + ' neue Fragen importiert'];
        if (pAdded) parts.push(pAdded + ' Paarfragen');
        if (dup) parts.push(dup + ' schon vorhanden');
        if (skipped) parts.push(skipped + ' ungültig');
        if (bil) parts.push('Bilanz übernommen');
        notice = parts.join(', ') + '.';
      } catch (e) {
        notice = 'Die Datei konnte nicht gelesen werden.';
      }
      go('home');
    };
    rd.readAsText(f);
  });

  function exportBackup() {
    var data = { version: 1, name: 'Quiz-Abend Sicherung', exported: new Date().toISOString(), kategorien: S.catLabels, fragen: S.imported, paarfragen: S.pq, bilanz: S.bilanz };
    var json = JSON.stringify(data, null, 2);
    var fname = 'quiz-abend-sicherung.json';
    try {
      var file = new File([json], fname, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function () {});
        return;
      }
    } catch (e) {}
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // Zwei Handys: Verbindung, Spielstand auf Handy 1 (Host), Ansicht auf beiden
  // ═══════════════════════════════════════════════════════════════════════════
  var APP_PREFIX = 'qa-ascend-';
  var PEER_URL = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';

  function newNet() {
    return { role: null, peer: null, conn: null, code: '', left: false, up: false, everUp: false,
             lastRx: 0, connStart: 0, hb: null, rc: null, rcTries: 0, msg: '', route: '', resume: false };
  }
  var net = newNet();
  var L = null;      // Spielstand (nur auf Handy 1)
  var LV = null;     // Ansichtsmodell für dieses Handy
  var lui = {};      // lokaler Zustand der Live-Ansicht
  var lwatch = null, ltimer = null, wakeLock = null, lkind = 'wissen';

  function myName() { return String(S.myName || '').trim().slice(0, 16); }
  function cleanName(n) { return String(n || '').trim().slice(0, 16); }
  function randomCode() { return String(Math.floor(1000 + Math.random() * 9000)); }
  function newGid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function loadPeerLib() {
    if (window.Peer) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = PEER_URL;
      sc.onload = function () { window.Peer ? resolve() : reject(new Error('lib')); };
      sc.onerror = function () { reject(new Error('lib')); };
      document.head.appendChild(sc);
    });
  }

  function errorText(err) {
    var t = err && err.type;
    if (t === 'peer-unavailable') return 'Raum nicht gefunden. Läuft Handy 1 schon?';
    if (t === 'network' || t === 'socket-error' || t === 'socket-closed') return 'Keine Verbindung zum Vermittlungsserver. Internet prüfen.';
    if (t === 'server-error') return 'Der Vermittlungsserver antwortet nicht.';
    if (t === 'browser-incompatible') return 'Dieser Browser unterstützt die Verbindung nicht.';
    if (t === 'webrtc') return 'Direkte Verbindung fehlgeschlagen.';
    return 'Fehler: ' + (t || (err && err.message) || 'unbekannt');
  }

  function netMsg(t) { net.msg = t; if (view === 'live') renderLive(); }
  function netSend(obj) {
    var c = net.conn;
    if (c && c.open) { try { c.send(obj); return true; } catch (e) {} }
    return false;
  }

  // ── Bildschirm wach halten ─────────────────────────────────────────────────
  function requestWake() {
    try {
      if (!('wakeLock' in navigator)) return;
      if (wakeLock && !wakeLock.released) return;
      navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
    } catch (e) {}
  }

  // ── Verbindung ─────────────────────────────────────────────────────────────
  function attachConn(c) {
    if (net.conn && net.conn !== c) { var old = net.conn; net.conn = null; try { old.close(); } catch (e) {} }
    net.conn = c; net.connStart = Date.now();
    c.on('open', function () {
      if (net.conn !== c) return;
      c._was = true;
      net.lastRx = Date.now(); net.rcTries = 0; net.up = true; net.everUp = true;
      startHb(); requestWake();
      setTimeout(detectRoute, 1500);
      if (net.role === 'guest') {
        lui.awaitSync = true;
        netSend({ t: 'hi', name: myName() });
        netMsg('Verbunden. Warte auf Handy 1 …');
      } else renderLive();
    });
    c.on('data', function (d) { if (net.conn === c) onNetData(d); });
    c.on('close', function () {
      if (net.conn !== c) return;
      if (net.up) linkDown('close');
      else if (net.role === 'guest') scheduleReconnect(1500);
    });
    c.on('error', function () {
      if (net.conn !== c) return;
      if (!net.up && net.role === 'guest') scheduleReconnect(2000);
    });
  }

  function linkDown(reason, msg) {
    if (!net.up) return;
    net.up = false; stopHb(); lStopTimer();
    var c = net.conn; if (c) { try { c.close(); } catch (e) {} }
    if (net.role === 'host') {
      net.msg = msg || 'Warte auf Handy 2 …';
      lGuestGone(reason);
    } else {
      net.msg = msg || 'Verbindung unterbrochen. Verbinde neu …';
      scheduleReconnect(1000);
    }
    renderLive();
  }

  function startHb() {
    stopHb();
    net.hb = setInterval(function () {
      if (!net.conn || !net.conn.open || !net.up) return;
      netSend({ t: 'ping', n: Date.now() });
      if (Date.now() - net.lastRx > 7000) linkDown('silence');
    }, 2000);
  }
  function stopHb() { if (net.hb) { clearInterval(net.hb); net.hb = null; } }

  function checkAlive() {
    if (!net.conn || !net.conn.open || !net.up) return;
    var t0 = Date.now();
    netSend({ t: 'ping', n: t0 });
    setTimeout(function () { if (!net.left && net.up && net.lastRx < t0) linkDown('silence'); }, 3500);
  }

  function detectRoute() {
    var c = net.conn;
    if (!c || !c.peerConnection || !c.peerConnection.getStats) return;
    c.peerConnection.getStats().then(function (stats) {
      var byId = {}, pair = null;
      stats.forEach(function (r) { byId[r.id] = r; });
      stats.forEach(function (r) { if (r.type === 'transport' && r.selectedCandidatePairId) pair = byId[r.selectedCandidatePairId]; });
      if (!pair) stats.forEach(function (r) { if (r.type === 'candidate-pair' && (r.selected || (r.nominated && r.state === 'succeeded'))) pair = r; });
      if (!pair) return;
      var a = byId[pair.localCandidateId], b = byId[pair.remoteCandidateId];
      var lt = a && a.candidateType, rt = b && b.candidateType;
      net.route = (lt === 'host' && rt === 'host') ? 'direkt im WLAN' : ((lt === 'relay' || rt === 'relay') ? 'über Relay-Server' : 'über den Router');
      if (view === 'live') renderLive();
    }).catch(function () {});
  }

  function onNetData(d) {
    if (!d || typeof d !== 'object') return;
    net.lastRx = Date.now();
    switch (d.t) {
      case 'ping': netSend({ t: 'pong', n: d.n }); break;
      case 'hi': if (net.role === 'host') onGuestHi(d); break;
      case 'act': if (net.role === 'host') lAct(1, d); break;
      case 'v': if (net.role === 'guest' && d.v) localApply(d.v); break;
      case 'busy':
        if (net.role === 'guest') { netMsg('Der Raum ist gerade belegt. Ich versuche es gleich noch einmal …'); scheduleReconnect(3000); }
        break;
      case 'rej':
        if (net.role === 'guest') leaveLive(false, d.why === 'name' ? 'Dieser Name ist im Raum schon vergeben. Bitte einen anderen Namen wählen.' : 'In diesem Raum läuft schon ein Spiel mit anderen Spielern.');
        break;
      case 'bye':
        if (net.role === 'guest') leaveLive(false, (LV && LV.names ? LV.names[0] : 'Handy 1') + ' hat das Spiel beendet.');
        else if (net.role === 'host') linkDown('bye', (L && L.names[1] ? L.names[1] : 'Handy 2') + ' hat das Spiel verlassen. Der Raum bleibt offen.');
        break;
    }
  }

  // ── Raum erstellen (Handy 1) ───────────────────────────────────────────────
  function lBuild(p) { return L.kind === 'paar' ? buildPV(p) : buildV(p); }

  function hostRoom(st, sv, kind) {
    requestWake();
    loadPeerLib().then(function () {
      net = newNet(); net.role = 'host';
      lui = {};
      if (sv) {
        net.code = sv.code; net.resume = true;
        L = sv.L; L.paused = false;
        if (L.kind !== 'paar') L.pool = makePool(L.settings);
        if (L.queue[L.idx]) L.it = L.queue[L.idx];
        if (L.phase === 'ask') { L.ans = [null, null]; lBeginQ(); }
        if (L.phase === 'feedback') L.ready = [false, false];
        net.msg = 'Raum ' + net.code + ' wird wieder geöffnet. Handy 2 verbindet sich automatisch oder tritt mit dem Code neu bei.';
      } else {
        net.code = randomCode();
        lNew(st, myName(), kind);
        net.msg = 'Verbinde mit dem Vermittlungsserver …';
      }
      LV = lBuild(0); lui.qk = LV.qk;
      view = 'live'; startHost(0); render();
    }).catch(function () {
      notice = 'Die Verbindungs-Bibliothek konnte nicht geladen werden. Ist das Internet an?'; go('lmenu');
    });
  }

  function startHost(attempt) {
    var pr = new Peer(APP_PREFIX + net.code, { debug: 1 });
    net.peer = pr;
    pr.on('open', function () {
      if (net.peer !== pr || net.left) return;
      if (!net.up) netMsg('Raum ' + net.code + ' ist offen. Warte auf Handy 2 …');
    });
    pr.on('connection', function (c) {
      if (net.peer !== pr || net.left) return;
      var same = net.conn && net.conn.peer === c.peer;
      var alive = net.conn && net.up && (Date.now() - net.lastRx < 8000);
      if (alive && !same) {
        c.on('open', function () { try { c.send({ t: 'busy' }); } catch (e) {} setTimeout(function () { try { c.close(); } catch (e) {} }, 300); });
        return;
      }
      attachConn(c);
    });
    pr.on('disconnected', function () {
      if (net.peer !== pr || net.left) return;
      try { pr.reconnect(); } catch (e) {}
    });
    pr.on('error', function (err) {
      if (net.peer !== pr || net.left) return;
      if (err && err.type === 'unavailable-id') {
        try { pr.destroy(); } catch (e) {}
        if (net.resume && attempt < 12) { setTimeout(function () { if (!net.left) startHost(attempt + 1); }, 2500); return; }
        if (!net.resume && attempt < 5) { net.code = randomCode(); startHost(attempt + 1); return; }
      }
      netMsg(errorText(err));
    });
  }

  // ── Beitreten (Handy 2) ────────────────────────────────────────────────────
  function joinRoom(code) {
    requestWake();
    loadPeerLib().then(function () {
      net = newNet(); net.role = 'guest'; net.code = code;
      S.lastCode = code; save();
      L = null; LV = null; lui = {};
      net.msg = 'Verbinde mit dem Vermittlungsserver …';
      view = 'live'; makeGuestPeer(); render();
    }).catch(function () {
      notice = 'Die Verbindungs-Bibliothek konnte nicht geladen werden. Ist das Internet an?'; go('lmenu');
    });
  }

  function makeGuestPeer() {
    if (net.peer && !net.peer.destroyed) { try { net.peer.destroy(); } catch (e) {} }
    var pr = new Peer({ debug: 1 });
    net.peer = pr;
    pr.on('open', function () {
      if (net.peer !== pr || net.left) return;
      if (!net.up) netMsg('Suche Raum ' + net.code + ' …');
      if (!(net.conn && net.conn.open)) connectToHost();
    });
    pr.on('disconnected', function () {
      if (net.peer !== pr || net.left) return;
      scheduleReconnect(1000);
    });
    pr.on('error', function (err) {
      if (net.peer !== pr || net.left) return;
      if (err && err.type === 'peer-unavailable') {
        if (!net.up) netMsg('Raum ' + net.code + ' nicht gefunden. Läuft Handy 1 schon? Ich versuche es weiter …');
        scheduleReconnect(3000);
        return;
      }
      if (!net.up) netMsg(errorText(err));
      scheduleReconnect(3000);
    });
  }

  function connectToHost() {
    if (!net.peer || net.peer.destroyed || net.peer.disconnected) return;
    if (net.conn && !net.conn.open && !net.conn._was && Date.now() - net.connStart < 8000) return;
    attachConn(net.peer.connect(APP_PREFIX + net.code, { reliable: true, serialization: 'json' }));
  }

  function scheduleReconnect(delay) {
    if (net.role !== 'guest' || net.rc || net.left) return;
    net.rc = setTimeout(function () {
      net.rc = null;
      if (net.left || (net.conn && net.conn.open && net.up)) { net.rcTries = 0; return; }
      if (net.rcTries >= 25) { netMsg('Keine Verbindung mehr. Bitte „Beenden“ tippen und neu beitreten.'); return; }
      net.rcTries++;
      doReconnect();
      scheduleReconnect(3000);
    }, delay);
  }

  function doReconnect() {
    if (net.role !== 'guest') return;
    if (!net.peer || net.peer.destroyed) { makeGuestPeer(); return; }
    if (net.peer.disconnected) { try { net.peer.reconnect(); } catch (e) {} return; }
    connectToHost();
  }

  document.addEventListener('visibilitychange', function () {
    if (!net.role || net.left) return;
    if (document.visibilityState !== 'visible') return;
    setTimeout(function () {
      if (net.left) return;
      if (net.conn && net.conn.open && net.up) { checkAlive(); requestWake(); }
      else if (net.role === 'guest') scheduleReconnect(300);
      if (net.peer && net.peer.disconnected) { try { net.peer.reconnect(); } catch (e) {} }
    }, 800);
  });

  function leaveLive(tell, text) {
    net.left = true;
    if (tell) netSend({ t: 'bye' });
    stopHb(); lStopTimer(); clearTimeout(lwatch);
    if (net.rc) { clearTimeout(net.rc); net.rc = null; }
    var c = net.conn, pr = net.peer, wl = wakeLock; wakeLock = null;
    setTimeout(function () {
      try { if (c) c.close(); } catch (e) {}
      try { if (pr) pr.destroy(); } catch (e) {}
    }, tell ? 250 : 0);
    try { if (wl) wl.release(); } catch (e) {}
    if (net.role === 'host') { S.live = null; save(); }
    net = newNet(); net.left = true;
    L = null; LV = null; lui = {};
    notice = text || '';
    go(text && /Namen|Spielern/.test(text) ? 'lmenu' : 'home');
  }

  // ═══ Spielstand auf Handy 1 ═════════════════════════════════════════════════
  function lNew(st, hostName, kind) {
    L = {
      kind: kind || 'wissen', gid: newGid(), settings: clone(st), names: [hostName, ''], phase: 'lobby',
      scores: [0, 0], right: [0, 0], stdAsked: [0, 0], estWins: [0, 0],
      jokers: [{ fifty: 1, swap: 1 }, { fifty: 1, swap: 1 }],
      queue: [], idx: 0, rounds: 0, it: null, order: null, ans: [null, null], hidden: [[], []],
      ready: [false, false], res: null, total: 0, deadline: 0, paused: false, pausedLeft: 0,
      allowEst: false, allowStd: false, pool: null
    };
  }

  function lStartGame() {
    if (L.kind === 'paar') return pStartGame();
    var st = L.settings, pool = poolFor(st);
    L.allowEst = pool.some(function (q) { return q.typ === 'est'; });
    L.allowStd = pool.some(function (q) { return q.typ !== 'est'; });
    L.gid = newGid(); L.scores = [0, 0]; L.right = [0, 0]; L.stdAsked = [0, 0]; L.estWins = [0, 0];
    L.jokers = [{ fifty: 1, swap: 1 }, { fifty: 1, swap: 1 }];
    L.queue = []; L.idx = 0; L.rounds = 0;
    L.pool = makePool(st);
    if (st.mode === 'count') lBuildQueue(); else lExtend();
    if (!L.queue.length) { L.phase = 'lobby'; return false; }
    lAsk();
    return true;
  }

  function lBuildQueue() {
    var n = L.settings.n, estCount = L.pool.est.length, e = 0;
    if (L.allowEst && !L.allowStd) e = Math.min(n, estCount);
    else if (L.allowEst) e = Math.min(Math.round(n * 0.2), estCount);
    var tokens = [], i;
    for (i = 0; i < e; i++) tokens.push('E');
    for (i = 0; i < (L.allowStd ? n - e : 0); i++) tokens.push('S');
    shuffle(tokens).forEach(function (t) {
      var q = t === 'E' ? takeEst(L) : takeStd(L);
      if (q) L.queue.push({ q: q });
    });
  }

  function lExtend() {
    L.rounds++;
    var q = null;
    if (L.allowEst && (!L.allowStd || Math.random() < 0.2)) q = takeEst(L);
    if (!q && L.allowStd) q = takeStd(L);
    if (q) L.queue.push({ q: q });
  }

  function lBeginQ() {
    var q = L.it.q;
    L.order = q.typ === 'mc' ? shuffle([0, 1, 2, 3]) : null;
    L.hidden = [[], []];
    L.total = TIME[q.typ] * 1000;
    if (net.up) { L.paused = false; L.deadline = Date.now() + L.total; lArmWatch(); }
    else { L.paused = true; L.pausedLeft = L.total; clearTimeout(lwatch); }
  }

  function lAsk() {
    L.it = L.queue[L.idx];
    L.phase = 'ask'; L.ans = [null, null]; L.ready = [false, false]; L.res = null;
    lBeginQ();
    lPush();
  }

  function lArmWatch() {
    clearTimeout(lwatch);
    if (!L || L.phase !== 'ask' || L.paused) return;
    lwatch = setTimeout(lWatch, Math.max(0, L.deadline - Date.now()) + 3000);
  }
  function lWatch() {
    if (!L || L.phase !== 'ask' || L.paused) return;
    for (var p = 0; p < 2; p++) if (!L.ans[p]) L.ans[p] = { v: null, left: 0, timeout: true };
    lResolve();
  }

  function lGuestGone(reason) {

      L.pausedLeft = Math.max(0, L.deadline - (reason === 'silence' ? net.lastRx : Date.now()));

    lPush();
  }
  function lResume() {

  }

  function onGuestHi(d) {
    if (!L) return;

    var running = L.phase !== 'lobby';
    if (bilanzKey(name) === bilanzKey(L.names[0])) { netSend({ t: 'rej', why: 'name' }); setTimeout(function () { try { net.conn.close(); } catch (e) {} }, 300); net.up = false; return; }
    if (running && L.names[1] && bilanzKey(name) !== bilanzKey(L.names[1])) { netSend({ t: 'rej', why: 'running' }); setTimeout(function () { try { net.conn.close(); } catch (e) {} }, 300); net.up = false; return; }
    L.names[1] = name;
    net.msg = name + ' ist verbunden.';
    if (L.paused) lResume();
    lPush();
  }

  function lAct(p, m) {
    if (!L || !m) return;
    if (L.kind === 'paar') return pAct(p, m);
    var a = m.a, q = L.it && L.it.q, left;
    if (a === 'answer' || a === 'guess' || a === 'timeout') {
      if (L.phase !== 'ask' || L.paused || L.ans[p]) return;
      left = Math.min(L.total, Math.max(0, Math.round(Number(m.left) || 0)));
      if (a === 'timeout') L.ans[p] = { v: null, left: 0, timeout: true };
      else if (a === 'answer' && q.typ === 'mc') {
        var d = Number(m.i);
        if (!(d >= 0 && d <= 3) || L.hidden[p].indexOf(L.order[d]) >= 0) return;
        L.ans[p] = { v: L.order[d], left: left };
      } else if (a === 'answer' && q.typ === 'tf') {
        if (typeof m.i !== 'boolean') return;
        L.ans[p] = { v: m.i, left: left };
      } else if (a === 'guess' && q.typ === 'est') {
        var g = Number(m.v);
        if (m.v === null || m.v === '' || !isFinite(g)) return;
        L.ans[p] = { v: g, left: left };
      } else return;
      if (L.ans[0] && L.ans[1]) lResolve(); else lPush();
    } else if (a === 'fifty') {
      var J = L.jokers[p];
      if (L.phase !== 'ask' || L.paused || q.typ !== 'mc' || J.fifty < 1 || L.ans[p] || L.hidden[p].length) return;
      var wrong = [0, 1, 2, 3].filter(function (i) { return i !== q.richtig; });
      L.hidden[p] = shuffle(wrong).slice(0, 2); J.fifty--;
      lPush();
    } else if (a === 'swap') {
      var K = L.jokers[p];
      if (L.phase !== 'ask' || L.paused || K.swap < 1 || L.ans[0] || L.ans[1] || q.typ === 'est') return;
      var nq = takeStd(L); if (!nq) return;
      L.it.q = nq; K.swap--;
      lBeginQ(); lPush();

      if (L.phase !== 'feedback') return;
      L.ready[p] = true;
      if (L.ready[0] && L.ready[1]) lAdvance(); else lPush();
    } else if (a === 'rematch') {
      if (L.phase !== 'over') return;
      L.ready[p] = true;
      if (L.ready[0] && L.ready[1]) { if (!lStartGame()) lPush(); } else lPush();
    }
  }

  function lResolve() {
    clearTimeout(lwatch);
    var q = L.it.q, A = L.ans, res = [{}, {}], i;
    if (q.typ === 'est') {
      var diff = A.map(function (x) { return x.v === null ? Infinity : Math.abs(x.v - q.richtig); });
      var best = Math.min(diff[0], diff[1]);
      for (i = 0; i < 2; i++) {
        var pts = 0, ex = false;
        if (isFinite(diff[i]) && diff[i] === best) { pts += POINTS; L.estWins[i]++; }
        if (isFinite(diff[i]) && diff[i] <= q.toleranz + 1e-9) { pts += EXACT_BONUS; ex = true; }
        L.scores[i] += pts;
        res[i] = { g: A[i].v, diff: isFinite(diff[i]) ? diff[i] : null, pts: pts, exact: ex };
      }
    } else {
      for (i = 0; i < 2; i++) {
        var a = A[i], ok = !a.timeout && a.v === q.richtig;
        var bonus = ok ? Math.round(BONUS_MAX * a.left / L.total) : 0;
        var pt = ok ? POINTS + bonus : 0;
        L.scores[i] += pt; L.stdAsked[i]++; if (ok) L.right[i]++;
        res[i] = { correct: ok, timeout: !!a.timeout, pts: pt, bonus: bonus };
      }
    }
    L.res = res; L.phase = 'feedback'; L.ready = [false, false];
    lPush();
  }

  function lAdvance() {
    L.idx++;
    if (L.settings.mode === 'count') {
      if (L.idx >= L.queue.length) return lFinish();
    } else {
      var a = L.scores[0], b = L.scores[1];
      if ((Math.max(a, b) >= L.settings.target && a !== b) || L.rounds >= 60) return lFinish();

      if (L.idx >= L.queue.length) return lFinish();
    }
    lAsk();
  }

  function lFinish() {

  function persistLive() {

  }

  function resumeLive() {
    var sv = S.live;
    if (!sv || !sv.L) return;
    hostRoom(null, sv);
  }

  // ── Ansichtsmodell ─────────────────────────────────────────────────────────
  function settingsRows(st) {
    var types = ['mc', 'tf', 'est'].filter(function (t) { return st.types[t]; }).map(function (t) { return TYPE_LABELS[t]; }).join(', ');
    return [

      ['Schwierigkeit', LEVELS[st.level]],

  }

  function buildV(p) {

              ready: L.ready.slice(), jk: { fifty: 0, swap: 0 }, my: null, oppDone: false, paused: false,
              left: 0, total: 0, canSwap: false, gid: L.gid };
    if (L.phase === 'lobby') { v.set = settingsRows(L.settings); return v; }
    if (L.phase === 'over') {
      v.qk = 'over:' + L.gid;
      v.final = { right: L.right.slice(), stdAsked: L.stdAsked.slice(), estWins: L.estWins.slice() };
      return v;
    }
    var q = L.it.q;
    v.qk = L.idx + ':' + q.id;
    v.prog = L.settings.mode === 'count' ? 'Frage ' + (L.idx + 1) + ' von ' + L.queue.length : 'Runde ' + (L.idx + 1) + ' · Ziel ' + L.settings.target + ' Punkte';
    v.q = { typ: q.typ, frage: q.frage, meta: metaLine(q), einheit: q.einheit || '' };
    if (q.typ === 'mc') v.q.opts = L.order.map(function (i) { return q.antworten[i]; });
    v.jk = clone(L.jokers[p]);
    v.hidden = L.hidden[p].map(function (i) { return L.order.indexOf(i); });
    var a = L.ans[p];
    if (a) v.my = { v: q.typ === 'mc' ? (a.v === null ? null : L.order.indexOf(a.v)) : a.v, timeout: !!a.timeout };
    v.oppDone = !!L.ans[o];
    if (L.phase === 'ask') {
      v.paused = !!L.paused; v.total = L.total;
      v.left = L.paused ? L.pausedLeft : Math.max(0, L.deadline - Date.now());

    } else {

      else v.fb = {

        res: L.res

  // Wird auf beiden Handys aufgerufen, sobald ein neues Ansichtsmodell vorliegt.

    if (lui.awaitSync) { lui.awaitSync = false; lui.sent = !!v.my; }

  function lTick() {
    var v = LV;

    lui.left = Math.max(0, lui.endsAt - Date.now());

    if (lui.left <= 0) {

  // ── Aktionen dieses Handys ─────────────────────────────────────────────────

  }

  // ── Zeichnen mit Teil-Aktualisierung (Eingabefeld und Tastatur bleiben erhalten) ──
  function liveKey() {

  // ═══════════════════════════════════════════════════════════════════════════
  // Paarabend: „Kennst du mich?“ und „Wie ähnlich sind wir?“ (nur auf zwei Handys)
  // ═══════════════════════════════════════════════════════════════════════════
  var PLEVELS = { 0: 'Gemischt', 1: 'Leicht', 2: 'Persönlich', 3: 'Tief' };
  var PLEVEL_HINT = {
    0: 'Von leicht bis tief, in dieser Reihenfolge.',
    1: 'Vorlieben und Alltag – locker zum Aufwärmen.',
    2: 'Erinnerungen, Alltag und ihr beide.',
    3: 'Wünsche, Werte und Nähe – am besten mit Ruhe und Zeit.'
  };
  var PJ_PTS = { T: 10, F: 5, D: 0 };
  var JD_LABEL = { T: 'Treffer', F: 'Fast', D: 'Daneben', G: 'Gleich', V: 'Unterschiedlich' };
  var pBack = 'home';
  var pform = { frage: '', typ: 'frei', stufe: 1, opts: ['', '', '', ''], err: '' };

  function cleanPQ(q) {
    if (!q || typeof q !== 'object') return null;
    var id = String(q.id || '').trim(), frage = String(q.frage || '').trim().slice(0, 200), stufe = Number(q.stufe), typ = q.typ;
    if (!id || !frage || [1, 2, 3].indexOf(stufe) < 0) return null;
    var out = { id: id, stufe: stufe, typ: typ, frage: frage };
    if (q.thema) out.thema = String(q.thema).slice(0, 40);
    if (typ === 'wahl') {
      if (!Array.isArray(q.optionen)) return null;
      var o = q.optionen.map(function (x) { return String(x).trim().slice(0, 80); }).filter(Boolean);
      if (o.length < 2 || o.length > 6) return null;
      out.optionen = o;
    } else if (typ !== 'frei') return null;
    return out;
  }

  function pPoolFor(st) {
    var all = [];
    if (st.vorschlag) all = all.concat(base.paar || []);
    if (st.eigen) all = all.concat(S.pq);
    return all.filter(function (q) { return st.level === 0 || q.stufe === st.level; });
  }

  function pBuildQueue(st) {
    var pool = pPoolFor(st), seen = {};
    S.pseen.forEach(function (id) { seen[id] = 1; });
    function order(a) {
      return shuffle(a.filter(function (q) { return !seen[q.id]; })).concat(shuffle(a.filter(function (q) { return seen[q.id]; })));
    }
    var picked = [];
    if (st.level === 0) {
      var lists = [1, 2, 3].map(function (l) { return order(pool.filter(function (q) { return q.stufe === l; })); });
      var guard = 0;
      while (picked.length < st.n && guard++ < 100) {
        var added = false;
        [0, 1, 0, 1, 2].forEach(function (li) {
          if (picked.length < st.n && lists[li].length) { picked.push(lists[li].shift()); added = true; }
        });
        if (!added) break;
      }
      picked.sort(function (a, b) { return a.stufe - b.stufe; });
    } else picked = order(pool).slice(0, st.n);
    picked.forEach(function (q) { if (S.pseen.indexOf(q.id) < 0) S.pseen.push(q.id); });
    if (S.pseen.length > 500) S.pseen = S.pseen.slice(-400);
    save();
    return picked.map(function (q) { return { q: q }; });
  }

  function psettingsRows(st) {
    var src = [st.vorschlag ? 'Vorschläge' : null, st.eigen ? 'Eigene' : null].filter(Boolean).join(' + ');
    var rows = [
      ['Spielart', st.pmode === 'kennt' ? 'Kennst du mich?' : 'Wie ähnlich sind wir?'],
      ['Tiefe', PLEVELS[st.level]],
      ['Fragen', st.n + ' · ' + src]
    ];
    if (st.pmode === 'kennt') rows.push(['Wertung', st.wertung === 'gegen' ? 'Gegeneinander' : 'Gemeinsam']);
    return rows;
  }

  // ── Ablauf auf Handy 1 ─────────────────────────────────────────────────────
  function pStartGame() {
    var st = L.settings;
    L.gid = newGid(); L.scores = [0, 0]; L.hits = [0, 0]; L.pairs = 0; L.matches = 0; L.skipped = 0; L.log = [];
    L.queue = pBuildQueue(st); L.idx = 0;
    if (!L.queue.length) { L.phase = 'lobby'; return false; }
    pBegin();
    return true;
  }

  function pBegin() {
    L.it = L.queue[L.idx]; L.phase = 'pself';
    L.self = [null, null]; L.guess = [null, null]; L.jd = [null, null]; L.ready = [false, false];
    lPush();
  }

  function pClean(q, v) {
    if (q.typ === 'wahl') { var i = Number(v); return (v !== null && v !== '' && Number.isInteger(i) && i >= 0 && i < q.optionen.length) ? i : null; }
    var t = String(v === null || v === undefined ? '' : v).trim().slice(0, 160);
    return t ? t : null;
  }
  function pTxt(q, v) { if (v === null || v === undefined) return ''; return q.typ === 'wahl' ? q.optionen[v] : v; }

  function pEnterReveal() {
    var q = L.it.q, st = L.settings, p;
    L.phase = 'preveal'; L.jd = [null, null]; L.ready = [false, false];
    if (q.typ !== 'wahl') return;
    if (st.pmode === 'aehnlich') { var same = L.self[0] === L.self[1]; L.jd = [same ? 'G' : 'V', same ? 'G' : 'V']; }
    else for (p = 0; p < 2; p++) L.jd[p] = L.guess[1 - p] === L.self[p] ? 'T' : 'D';
  }

  function pApply() {
    var q = L.it.q, st = L.settings, p;
    var entry = { f: q.frage, a: [pTxt(q, L.self[0]), pTxt(q, L.self[1])] };
    L.pairs++;
    if (st.pmode === 'aehnlich') {
      var match = L.jd[0] === 'G' && L.jd[1] === 'G';
      if (match) L.matches++;
      entry.m = match;
    } else {
      entry.g = [pTxt(q, L.guess[0]), pTxt(q, L.guess[1])];
      entry.r = [0, 0];
      for (p = 0; p < 2; p++) {
        var gu = 1 - p, pts = PJ_PTS[L.jd[p]] || 0;
        L.scores[gu] += pts; L.hits[gu] += pts / 10; entry.r[gu] = pts;
      }
    }
    L.log.push(entry);
  }

  function pAdvance() {
    L.idx++;
    if (L.idx >= L.queue.length) return pFinish();
    pBegin();
  }

  function pFinish() {
    L.phase = 'over'; L.ready = [false, false]; L.it = null;
    S.live = null; save();
    lPush();
  }

  function pAct(p, m) {
    var a = m.a, q = L.it && L.it.q, st = L.settings;
    if (a === 'pself') {
      if (L.phase !== 'pself' || L.self[p] !== null) return;
      var v = pClean(q, m.v); if (v === null) return;
      L.self[p] = v;
      if (L.self[0] !== null && L.self[1] !== null) { if (st.pmode === 'aehnlich') pEnterReveal(); else L.phase = 'pguess'; }
      lPush();
    } else if (a === 'pguess') {
      if (L.phase !== 'pguess' || L.guess[p] !== null) return;
      var g = pClean(q, m.v); if (g === null) return;
      L.guess[p] = g;
      if (L.guess[0] !== null && L.guess[1] !== null) pEnterReveal();
      lPush();
    } else if (a === 'pjudge') {
      if (L.phase !== 'preveal' || L.jd[p] !== null) return;
      var okv = st.pmode === 'aehnlich' ? ['G', 'V'] : ['T', 'F', 'D'];
      if (okv.indexOf(m.v) < 0) return;
      L.jd[p] = m.v;
      lPush();
    } else if (a === 'pnext') {
      if (L.phase !== 'preveal' || L.jd[0] === null || L.jd[1] === null) return;
      L.ready[p] = true;
      if (L.ready[0] && L.ready[1]) { pApply(); pAdvance(); } else lPush();
    } else if (a === 'pskip') {
      if (L.phase !== 'pself' && L.phase !== 'pguess') return;
      L.skipped++; L.log.push({ f: q.frage, skip: true });
      pAdvance();
    } else if (a === 'rematch') {
      if (L.phase !== 'over') return;
      L.ready[p] = true;
      if (L.ready[0] && L.ready[1]) { if (!lStartGame()) lPush(); } else lPush();
    }
  }

  // ── Ansichtsmodell ─────────────────────────────────────────────────────────
  function buildPV(p) {
    var o = 1 - p, st = L.settings;
    var v = { kind: 'paar', phase: L.phase, me: p, names: L.names.slice(), scores: (L.scores || [0, 0]).slice(), qk: L.phase, hidden: [],
              ready: L.ready.slice(), jk: { fifty: 0, swap: 0 }, my: null, oppDone: false, paused: false, left: 0, total: 0,
              canSwap: false, gid: L.gid, sig: '', pm: st.pmode, wertung: st.wertung };
    if (L.phase === 'lobby') { v.set = psettingsRows(st); return v; }
    v.stats = { pairs: L.pairs, matches: L.matches, hits: L.hits[0] + L.hits[1], skipped: L.skipped };
    if (L.phase === 'over') {
      v.qk = 'over:' + L.gid;
      v.final = { hits: L.hits.slice(), log: L.log.slice(0, 40), n: L.queue.length };
      v.sig = 'over|' + L.ready.join('');
      return v;
    }
    var q = L.it.q;
    v.qk = L.idx + ':' + q.id + ':' + L.phase;
    v.prog = 'Frage ' + (L.idx + 1) + ' von ' + L.queue.length;
    v.q = { typ: q.typ, frage: q.frage, opts: q.optionen || null, meta: (q.thema || 'Frage') + ' · ' + levelDots(q.stufe) };
    if (L.phase === 'pself') {
      v.my = L.self[p] !== null ? { v: L.self[p] } : null; v.oppDone = L.self[o] !== null;
      v.sig = 'pself|' + (v.my ? 1 : 0);
    } else if (L.phase === 'pguess') {
      v.my = L.guess[p] !== null ? { v: L.guess[p] } : null; v.oppDone = L.guess[o] !== null;
      v.sig = 'pguess|' + (v.my ? 1 : 0);
    } else {
      var rv = { mySelf: pTxt(q, L.self[p]), oppSelf: pTxt(q, L.self[o]), jd: L.jd.slice() };
      if (st.pmode === 'kennt') { rv.myGuess = pTxt(q, L.guess[p]); rv.oppGuess = pTxt(q, L.guess[o]); }
      v.rv = rv;
      v.sig = 'rv|' + L.jd.join('') + '|' + L.ready.join('');
    }
    return v;
  }

  function pStatusText(v) {
    if (v.phase !== 'pself' && v.phase !== 'pguess') return '';
    var opp = v.names[1 - v.me], done = !!(v.my || lui.sent);
    if (done) return v.oppDone ? '' : 'Gespeichert. Warte auf ' + opp + ' …';
    return v.oppDone ? opp + ' ist schon fertig.' : '';
  }

    } else if (q.opts) {
      card.append(el('div', { class: 'answers' }, q.opts.map(function (txt, d) {
        return el('button', { class: 'ans' + (lui.pick === d ? ' picked' : ''), disabled: !can, onclick: function () { lui.pick = d; renderLive(); } },
          el('span', { class: 'letter', text: 'ABCDEF'.charAt(d) }), el('span', { class: 'atext', text: txt }));
      })));
      card.append(el('button', { class: 'btn primary', style: 'margin-top:14px', text: guessing ? 'Tipp abgeben' : 'Antwort abgeben',
        disabled: !can || lui.pick === null || lui.pick === undefined, onclick: function () { pSubmit(kind, lui.pick); } }));
    } else {
      var ta = el('textarea', { id: 'lguess', rows: '3', maxlength: '160', placeholder: guessing ? 'Dein Tipp …' : 'Deine Antwort …', disabled: !can,
        oninput: function () { lui.draft = this.value; btn.disabled = !this.value.trim() || !can; } });
      ta.value = lui.draft || '';
      var btn = el('button', { class: 'btn primary', text: guessing ? 'Tipp abgeben' : 'Antwort abgeben', disabled: !can || !(lui.draft || '').trim(),
        onclick: function () { if (ta.value.trim()) pSubmit(kind, ta.value.trim()); } });

    return el('div', null, card,
      el('button', { class: 'btn ghost', text: 'Frage überspringen', disabled: !can, onclick: function () { lSend({ a: 'pskip' }); } }));
  }

  function judgeButtons(labels, name, who) {
    return el('div', null,
      el('div', { class: 'info', style: 'margin:12px 0 8px', text: name }),
      el('div', { class: 'btnrow' }, labels.map(function (k) {
        return el('button', { class: 'btn small', disabled: !pCan(), text: JD_LABEL[k], onclick: function () { lSend({ a: 'pjudge', v: k }); } });
      })));
  }

  function pReveal(v) {
    var q = v.q, rv = v.rv, me = v.me, opp = 1 - me, names = v.names, kennt = v.pm === 'kennt';
    var jme = rv.jd[me], jop = rv.jd[opp], both = jme !== null && jop !== null;
    var auto = !!q.opts;
    var card = el('div', { class: 'card' }, el('div', { class: 'meta', text: q.meta }), el('div', { class: 'qtext', text: q.frage }));
    function row(k, t) { return el('div', { class: 'row' }, el('span', { class: 'k', text: k }), el('span', { class: 'v', text: t })); }

    if (kennt) {
      card.append(el('div', { class: 'label', text: 'Über dich' }), row('Deine Antwort', rv.mySelf), row(names[opp] + ' hat geraten', rv.oppGuess));
      if (jme === null) card.append(judgeButtons(['T', 'F', 'D'], 'Wie nah lag ' + names[opp] + '?'));
      else card.append(el('div', { class: 'info', style: 'margin:10px 0 0', text: 'Deine Bewertung: ' + JD_LABEL[jme] }));
      card.append(el('div', { class: 'label', style: 'margin-top:18px', text: 'Über ' + names[opp] }), row(names[opp] + ' hat geantwortet', rv.oppSelf), row('Du hast geraten', rv.myGuess));
      if (jop === null) card.append(el('div', { class: 'info', style: 'margin:10px 0 0', text: 'Warte auf die Bewertung von ' + names[opp] + ' …' }));
      else card.append(el('div', { class: 'banner ' + (jop === 'T' ? 'good' : (jop === 'F' ? 'neutral' : 'miss')) },
        jop === 'T' ? 'Treffer!' : (jop === 'F' ? 'Fast!' : 'Diesmal daneben'), el('small', { text: '+' + PJ_PTS[jop] + ' Punkte' })));
    } else {
      card.append(row('Du', rv.mySelf), row(names[opp], rv.oppSelf));
      if (jme === null) card.append(judgeButtons(['G', 'V'], 'Sind eure Antworten ähnlich?'));
      else if (!both) card.append(el('div', { class: 'info', style: 'margin:10px 0 0', text: 'Warte auf ' + names[opp] + ' …' }));
      else {
        var same = jme === 'G' && jop === 'G';
        card.append(el('div', { class: 'banner ' + (same ? 'good' : 'neutral') }, same ? 'Gleich!' : 'Unterschiedlich', el('small', { text: same ? 'Da seid ihr euch einig.' : 'Spannend – darüber könnt ihr kurz reden.' })));
      }
    }
    var btn = null;
    if (both) btn = v.ready[me]
      ? el('button', { class: 'btn', text: 'Warte auf ' + names[opp] + ' …', disabled: true })
      : el('button', { class: 'btn primary', text: 'Weiter', onclick: function () { lSend({ a: 'pnext' }); } });
    return el('div', null, card, btn);
  }

  function viewPaarOver(v) {
    var s = v.stats, F = v.final, names = v.names, me = v.me, opp = 1 - me, a = v.scores[0], b = v.scores[1];
    var head;
    if (v.pm === 'aehnlich') {
      head = el('div', { class: 'card center', style: 'padding:26px 16px' },
        el('div', { class: 'trophy', text: 'Gemeinsam' }),
        el('div', { class: 'big', text: s.pairs ? 'Bei ' + s.matches + ' von ' + s.pairs + ' Fragen gleich' : 'Keine Frage beantwortet' }));
    } else if (v.wertung === 'gegen') {
      var win = a > b ? 0 : (b > a ? 1 : -1);
      head = el('div', { class: 'card center', style: 'padding:26px 16px' },
        el('div', { class: 'trophy', text: win < 0 ? 'Unentschieden' : 'Vorn liegt' }),
        el('div', { class: 'big', text: win < 0 ? 'Gleichstand bei ' + a + ' Punkten' : (win === me ? 'Du' : names[win]) }),
        el('div', { class: 'info', style: 'margin:8px 0 0', text: names[0] + ' ' + a + ' · ' + names[1] + ' ' + b }));
    } else {
      head = el('div', { class: 'card center', style: 'padding:26px 16px' },
        el('div', { class: 'trophy', text: 'Gemeinsame Treffer' }),
        el('div', { class: 'big', text: fmt(s.hits) + ' von ' + (s.pairs * 2) }));
    }
    var log = F.log.map(function (e) {
      if (e.skip) return el('div', { class: 'qa skip' }, el('div', { class: 'qf', text: e.f }), 'übersprungen');
      var lines = [el('div', null, names[0] + ': ' + e.a[0]), el('div', null, names[1] + ': ' + e.a[1])];
      var tail = e.m !== undefined ? (e.m ? 'gleich' : 'unterschiedlich') : (names[0] + ' +' + e.r[0] + ' · ' + names[1] + ' +' + e.r[1]);
      return el('div', { class: 'qa' }, el('div', { class: 'qf', text: e.f }), lines, el('div', { class: 'qf', style: 'margin:3px 0 0', text: tail }));
    });
    var rematch = v.ready[me]
      ? el('button', { class: 'btn', text: 'Warte auf ' + names[opp] + ' …', disabled: true })
      : el('button', { class: 'btn primary', text: 'Noch eine Runde', disabled: !net.up, onclick: function () { lSend({ a: 'rematch' }); } });
    return el('div', null, header('Ergebnis'), liveLinkNote(v), head,
      el('div', { class: 'card' },
        el('div', { class: 'label', text: 'Zum Weiterreden' }),
        el('div', { class: 'info', style: 'margin:0', text: 'Welche Antwort hat euch überrascht? Was habt ihr heute Neues voneinander erfahren? Wofür möchtet ihr dem anderen danken?' })),
      log.length ? el('div', { class: 'card' }, el('div', { class: 'label', text: 'Rückblick' }), log) : null,
      s.skipped ? el('div', { class: 'hint center', text: s.skipped + (s.skipped === 1 ? ' Frage übersprungen.' : ' Fragen übersprungen.') }) : null,
      rematch,
      el('button', { class: 'btn ghost', text: 'Zum Start', onclick: function () { leaveLive(true, ''); } }));
  }

  // ── Einrichtung (Handy 1) ──────────────────────────────────────────────────
  function viewPSetup() {
    var st = S.psettings, pool = pPoolFor(st);
    function upd(fn) { fn(); save(); render(); }
    var warn = '';
    if (!pool.length) warn = 'Mit dieser Auswahl gibt es keine Fragen.';
    else if (pool.length < st.n) warn = 'Nur ' + pool.length + ' passende Fragen – es werden entsprechend weniger gespielt.';
    function seg(options, cur, set) {
      return el('div', { class: 'seg' }, options.map(function (o) {
        return el('button', { class: cur === o[0] ? 'sel' : '', text: o[1], onclick: function () { upd(function () { set(o[0]); }); } });
      }));
    }
    return el('div', null,
      el('div', { class: 'topbar' }, header('Paarabend'), el('button', { class: 'linkbtn', text: 'Zurück', onclick: function () { go('lmenu'); } })),
      notice ? el('div', { class: 'notice', text: notice }) : null,
      el('div', { class: 'card' },
        el('div', { class: 'label', text: 'Spielart' }),
        seg([['kennt', 'Kennst du mich?'], ['aehnlich', 'Wie ähnlich sind wir?']], st.pmode, function (x) { st.pmode = x; }),
        el('div', { class: 'hint', text: st.pmode === 'kennt'
          ? 'Beide beantworten eine Frage für sich und raten dann, was der andere geantwortet hat.'
          : 'Beide beantworten eine Frage für sich. Danach seht ihr, wo ihr gleich geantwortet habt.' })),
      el('div', { class: 'card' },
        el('div', { class: 'label', text: 'Tiefe' }),
        el('div', { class: 'chips' }, [1, 2, 3, 0].map(function (l) {
          return el('button', { class: 'chip' + (st.level === l ? ' sel' : ''), text: PLEVELS[l], onclick: function () {
            upd(function () { st.level = l; if (l === 3) st.wertung = 'gemeinsam'; });
          } });
        })),
        el('div', { class: 'hint', text: PLEVEL_HINT[st.level] + (st.level === 3 && st.pmode === 'kennt' ? ' Dazu passt die gemeinsame Wertung.' : '') })),
      el('div', { class: 'card' },
        el('div', { class: 'label', text: 'Fragen' }),
        el('div', { class: 'chips' },
          el('button', { class: 'chip' + (st.vorschlag ? ' sel' : ''), text: 'Vorschläge (' + (base.paar || []).length + ')', onclick: function () { upd(function () { if (st.vorschlag && !st.eigen) return; st.vorschlag = !st.vorschlag; }); } }),
          el('button', { class: 'chip' + (st.eigen ? ' sel' : ''), text: 'Eigene (' + S.pq.length + ')', onclick: function () { upd(function () { if (st.eigen && !st.vorschlag) return; st.eigen = !st.eigen; }); } })),
        el('div', { class: 'stepper' },
          el('button', { text: '−', 'aria-label': 'Weniger Fragen', onclick: function () { upd(function () { st.n = Math.max(6, st.n - 2); }); } }),
          el('div', { class: 'val' }, String(st.n), el('span', { class: 'unit', text: 'Fragen' })),
          el('button', { text: '+', 'aria-label': 'Mehr Fragen', onclick: function () { upd(function () { st.n = Math.min(20, st.n + 2); }); } })),
        el('div', { class: 'center' }, el('button', { class: 'linkbtn', text: 'Eigene Fragen verwalten', onclick: function () { pBack = 'psetup'; go('pmanage'); } }))),
      st.pmode === 'kennt' ? el('div', { class: 'card' },
        el('div', { class: 'label', text: 'Wertung' }),
        seg([['gegen', 'Gegeneinander'], ['gemeinsam', 'Gemeinsam']], st.wertung, function (x) { st.wertung = x; }),
        el('div', { class: 'hint', text: st.wertung === 'gegen'
          ? 'Jeder sammelt Punkte für richtige Tipps (10 für einen Treffer, 5 für „fast“). Am Ende liegt einer vorn.'
          : 'Alle Treffer zählen zusammen. Es gibt keinen Sieger, ihr spielt miteinander.' })) : null,
      el('div', { class: 'hint' + (warn ? ' warn' : ''), style: 'margin:0 0 14px', text: warn || (pool.length + ' passende Fragen. Jede Frage lässt sich überspringen.') }),
      el('button', { class: 'btn primary', text: 'Raum erstellen', disabled: !pool.length, onclick: function () { save(); hostRoom(clone(st), null, 'paar'); } }));
  }

  // ── Eigene Fragen ──────────────────────────────────────────────────────────
  function viewPManage() {
    var f = pform;
    function refresh() { render(); }
    function addQuestion() {
      var opts = f.opts.map(function (x) { return x.trim(); }).filter(Boolean);
      var raw = { id: 'own-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), stufe: f.stufe, typ: f.typ, frage: f.frage };
      if (f.typ === 'wahl') raw.optionen = opts;
      var q = cleanPQ(raw);
      if (!f.frage.trim()) f.err = 'Bitte eine Frage eintippen.';
      else if (!q) f.err = f.typ === 'wahl' ? 'Für eine Auswahlfrage braucht es mindestens zwei Antworten.' : 'Die Frage konnte nicht gespeichert werden.';
      else {
        S.pq.push(q); save();
        pform = { frage: '', typ: f.typ, stufe: f.stufe, opts: ['', '', '', ''], err: '' };
      }
      refresh();
    }
    var list = S.pq.length
      ? S.pq.map(function (q, i) {
          return el('div', { class: 'own' },
            el('div', { class: 't' }, q.frage, el('span', { class: 'm', text: PLEVELS[q.stufe] + ' · ' + (q.typ === 'wahl' ? 'Auswahl (' + q.optionen.length + ')' : 'Freitext') })),
            el('button', { text: 'Löschen', onclick: function () { if (confirm('Diese Frage löschen?')) { S.pq.splice(i, 1); save(); refresh(); } } }));
        })
      : el('div', { class: 'info', style: 'margin:0', text: 'Noch keine eigenen Fragen.' });
    return el('div', null,
      el('div', { class: 'topbar' }, header('Eigene Paarfragen'), el('button', { class: 'linkbtn', text: 'Zurück', onclick: function () { go(pBack); } })),
      el('p', { class: 'lead', text: 'Eigene Fragen bleiben nur auf diesem Handy. Im Spiel zählen die Fragen von Handy 1. Formuliere sie so, dass beide sie für sich beantworten können („Was …, du?“).' }),
      el('div', { class: 'card' },
        el('div', { class: 'label', text: 'Neue Frage' }),
        el('input', { type: 'text', id: 'pf-frage', maxlength: '200', placeholder: 'z. B. Dein schönster Urlaubstag?', autocomplete: 'off', value: f.frage,
          oninput: function () { f.frage = this.value; f.err = ''; } }),
        el('div', { class: 'chips', style: 'margin-bottom:10px' },
          el('button', { class: 'chip' + (f.typ === 'frei' ? ' sel' : ''), text: 'Freitext', onclick: function () { f.typ = 'frei'; refresh(); } }),
          el('button', { class: 'chip' + (f.typ === 'wahl' ? ' sel' : ''), text: 'Auswahl', onclick: function () { f.typ = 'wahl'; refresh(); } })),
        f.typ === 'wahl' ? f.opts.map(function (o, i) {
          return el('input', { type: 'text', maxlength: '80', placeholder: 'Antwort ' + (i + 1) + (i < 2 ? '' : ' (optional)'), autocomplete: 'off', value: o,
            oninput: function () { f.opts[i] = this.value; f.err = ''; } });
        }) : null,
        el('div', { class: 'hint', style: 'margin:4px 0 8px', text: 'Wie tief ist die Frage?' }),
        el('div', { class: 'chips', style: 'margin-bottom:10px' }, [1, 2, 3].map(function (l) {
          return el('button', { class: 'chip' + (f.stufe === l ? ' sel' : ''), text: PLEVELS[l], onclick: function () { f.stufe = l; refresh(); } });
        })),
        el('div', { class: 'errtext', text: f.err }),
        el('button', { class: 'btn primary', text: 'Frage hinzufügen', onclick: addQuestion })),
      el('div', { class: 'card' }, el('div', { class: 'label', text: 'Deine Fragen (' + S.pq.length + ')' }), list));
  }


  // ── Start ──────────────────────────────────────────────────────────────────
  function boot() { loadBase().then(function () { render(); }); }
  boot();
})();
</script>
</body>
</html>
